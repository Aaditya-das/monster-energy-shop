<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Energy — pick your can</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a1a00;--accent:#e8590c;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;background:#2a1a10;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;user-select:none;touch-action:none}
#stage{position:relative;height:100%;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 54%,rgba(255,255,255,.38),transparent 56%)}
#words,#back,#cans,#front{position:absolute;inset:0;pointer-events:none}
#words{z-index:1}#back{z-index:2}#cans{z-index:3}#front{z-index:4}
.word{position:absolute;left:50%;top:48%;white-space:nowrap;font-family:Anton,Impact,sans-serif;line-height:.95;letter-spacing:.01em}
.can{position:absolute;left:50%;top:51%}
.can img{display:block;height:min(66vh,110vw);width:auto;max-width:80vw;filter:drop-shadow(0 24px 22px rgba(0,0,0,.28))}
.ing{position:absolute;}
.ing span{display:block}.ing svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
header{position:absolute;z-index:10;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 4vw 0}
.logo{font:28px Anton,Impact,sans-serif;letter-spacing:.06em;color:var(--ink)}
.bag{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.bag svg{width:22px;height:22px}
#badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font:700 12px/22px 'DM Sans',sans-serif;text-align:center;padding:0 5px;transform:scale(0)}
.copy{position:absolute;z-index:6;left:4vw;top:50%;transform:translateY(-50%);width:min(24vw,300px)}
.copy>*{display:block}
#tag{font:700 12px 'DM Sans';letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
#desc{font-size:17px;line-height:1.5;font-weight:500;margin-bottom:16px}
#chips span{display:inline-block;margin:0 6px 6px 0;padding:5px 12px;border:1.5px solid var(--ink);border-radius:20px;font-size:12px;font-weight:700}
.buy{position:absolute;z-index:6;right:4vw;top:50%;transform:translateY(-50%);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
#price{font:46px/1 Anton,Impact,sans-serif;color:var(--ink)}
#unit{font-size:13px;font-weight:700;opacity:.7;margin-top:-8px}
.step{display:flex;align-items:center;border:2px solid var(--ink);border-radius:30px;overflow:hidden}
.step button{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
.step button:hover{background:rgba(0,0,0,.08)}
#qty{min-width:34px;text-align:center;font-weight:700;font-size:18px}
#shop{border:0;border-radius:30px;padding:16px 38px;background:var(--ink);color:var(--bt);font:700 16px 'DM Sans';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .15s}
#shop:hover{transform:scale(1.05)}#shop:active{transform:scale(.96)}
.arrow{position:absolute;z-index:8;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,255,255,.25);color:var(--ink);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px)}
.arrow svg{width:22px;height:22px}.arrow:hover{background:var(--ink);color:var(--bt)}
#prev{left:calc(4vw + min(24vw,300px) + 2vw)}#next{right:calc(4vw + 230px)}
#thumbs{position:absolute;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:14px}
#thumbs button{width:62px;height:84px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.28);cursor:pointer;opacity:.6;transition:.3s;padding:4px}
#thumbs button.on{opacity:1;border-color:var(--ink);transform:translateY(-6px)}
#thumbs img{width:100%;height:100%;object-fit:contain;display:block}
#toast{position:absolute;z-index:20;left:50%;bottom:120px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bt);padding:13px 24px;border-radius:30px;font-weight:700;font-size:14px;white-space:nowrap;pointer-events:none}
@media (max-width:760px){
 .can{top:47%}.can img{height:50vh}
 .copy{top:78px;transform:none;left:20px;right:20px;width:auto}
 #desc{font-size:14px;margin-bottom:8px}#chips{display:none}
 .buy{top:auto;transform:none;right:20px;left:20px;bottom:126px;flex-direction:row;justify-content:space-between;align-items:center;gap:10px}
 #price{font-size:30px}#unit{display:none}#shop{padding:14px 22px}
 .step button{width:36px;height:40px}
 .arrow{top:auto;bottom:22px;margin:0;width:44px;height:44px}#prev{left:14px}#next{right:14px}
 #thumbs button{width:52px;height:72px}#toast{bottom:190px}
}
.hr{display:flex;align-items:center;gap:12px}
#acct{height:46px;padding:0 20px;border-radius:23px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 14px 'DM Sans',sans-serif;cursor:pointer}
#acct:hover{background:var(--ink);color:var(--bt)}
.legal{position:absolute;z-index:8;left:4vw;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-wrap:wrap;gap:4px 12px;max-width:230px;font-size:12px;font-weight:700}
.legal a{color:var(--ink);opacity:.75;text-decoration:none}.legal a:hover{opacity:1;text-decoration:underline}
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.card{position:relative;width:min(520px,100%);max-height:86vh;max-height:calc(100dvh - 32px);overflow-y:auto;background:#fffdf8;color:#1b1b1b;border-radius:22px;padding:28px;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.x{float:right;position:sticky;top:0;width:34px;height:34px;border:0;border-radius:50%;background:#ececec;font-size:20px;cursor:pointer;color:#222}
.card h3{font:30px Anton,Impact,sans-serif;letter-spacing:.02em;margin-bottom:6px}
.card h4{font-size:14px;margin:16px 0 4px}.card p,.card li{font-size:14px;line-height:1.6;color:#444}.card ul{padding-left:18px}
.card a{color:#111;font-weight:700}.card .d{font-size:12px;color:#888;margin-bottom:4px}
.tabs{display:flex;gap:8px;margin:4px 0 16px}.tabs button{flex:1;padding:11px;border:2px solid #111;border-radius:24px;background:#fff;font:700 14px 'DM Sans',sans-serif;cursor:pointer}.tabs button.on{background:#111;color:#fff}
.card label{display:block;font-size:12px;font-weight:700;margin-bottom:12px;color:#222}
.card input:not([type=checkbox]){display:block;width:100%;margin-top:5px;padding:12px;border:1.5px solid #ccc;border-radius:10px;font:15px 'DM Sans',sans-serif;user-select:text;-webkit-user-select:text;touch-action:auto}
.card .ck{display:flex;gap:8px;align-items:flex-start;font-weight:500}
#err{color:#c0281c;font-size:13px;min-height:20px}
.go{width:100%;padding:14px;border:0;border-radius:26px;background:#111;color:#fff;font:700 15px 'DM Sans',sans-serif;cursor:pointer;margin:6px 0 12px}
.note{font-size:12px!important;color:#777!important}
@media (max-width:760px){.buy{bottom:144px}.arrow{bottom:40px}#thumbs{bottom:calc(env(safe-area-inset-bottom,0px) + 34px)}#toast{bottom:206px}.legal{left:0;right:0;max-width:none;justify-content:center;font-size:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);gap:4px 10px}#acct{height:40px;padding:0 14px}.bag{width:40px;height:40px}.card{padding:22px}}
button,a{transition:background .25s,color .25s,transform .2s,opacity .25s,border-color .25s}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.logo{cursor:pointer}#toast{z-index:60}
#hint{position:absolute;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 114px);font-size:12px;font-weight:700;opacity:0;pointer-events:none;white-space:nowrap;color:var(--ink)}
#hero{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);text-align:center;color:#e8ffd0;background:radial-gradient(circle at 50% 75%,#35661f,#07100a 72%);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:hidden;touch-action:none}
.hk{font:700 12px 'DM Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9be23a}
#hname{font:min(10vw,16vh)/.92 Anton,Impact,sans-serif;text-transform:uppercase;max-width:94vw}
.htag{font-size:clamp(14px,2vh,18px);max-width:520px;opacity:.85;line-height:1.5}
.hrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta{padding:16px 36px;border:0;border-radius:30px;background:#9be23a;color:#07100a;font:700 16px 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}.cta:hover{transform:scale(1.05)}
.ghost{padding:14px 26px;border:2px solid #e8ffd0;border-radius:30px;background:transparent;color:#e8ffd0;font:700 15px 'DM Sans',sans-serif;cursor:pointer}.ghost:hover{background:#e8ffd0;color:#07100a}
.fan{display:flex;justify-content:center;align-items:flex-end;margin-top:clamp(6px,2vh,20px)}
.fan img{height:min(28vh,250px);width:auto;margin:0 -10px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.hs{font-size:12px;opacity:.6}
@media (max-width:760px){.logo{font-size:20px}.fan img{height:22vh;margin:0 -14px}}
#rail{position:absolute;z-index:8;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
#rail button{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;cursor:pointer;opacity:.5}
#rail button.on{background:var(--ink);opacity:1;transform:scale(1.3)}
.can,.word,.ing,#hero{will-change:transform}
html{height:auto;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{height:auto;overflow-y:auto;touch-action:auto}body.m,body.a{overflow:hidden}
#stage{position:fixed;inset:0;height:auto}#scroller{height:900vh}#hero{touch-action:pan-y}
</style></head>

const SLOTS=[[22,24,9,10,0],[76,20,8,-20,1],[12,52,7,40,1],[88,56,10,15,0],[27,80,9,-30,1],[72,82,8,25,1],[40,10,6,70,0],[62,92,7,-50,0],[16,76,6,100,0],[84,32,6,-70,1]];
const canImg=f=>`<img src="${f.img}" alt="${f.name}" draggable="false">`;
const $=s=>document.querySelector(s),stage=$('#stage');
const bgs=F.map(f=>{const d=document.createElement('div');d.className='bg';d.style.background=`linear-gradient(160deg,${f.bg[0]},${f.bg[1]})`;$('#bgs').appendChild(d);return d});
const thumbs=F.map((f,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',f.word.toLowerCase());b.innerHTML=canImg(f);b.onclick=()=>go(i);$('#thumbs').appendChild(b);return b});
function fit(e){e.style.fontSize='100px';const w=e.offsetWidth;e.style.fontSize=Math.min(100*innerWidth*.94/w,innerHeight*.6)+'px'}
function build(i){
 const f=F[i],o={i,items:[]};
 const w=document.createElement('div');w.className='word';w.textContent=f.word;w.style.color=f.wordC;$('#words').appendChild(w);fit(w);gsap.set(w,{xPercent:-50,yPercent:-50});o.word=w;
 const c=document.createElement('div');c.className='can';c.innerHTML='<div>'+canImg(f)+'</div>';$('#cans').appendChild(c);gsap.set(c,{xPercent:-50,yPercent:-50});o.can=c;
 const t=c.firstChild;gsap.fromTo(t,{y:10,rotation:-13},{y:-12,rotation:-8,duration:2.6,yoyo:true,repeat:-1,ease:'sine.inOut'});o.tilt=t;
 SLOTS.forEach(([x,y,s,r,fr],n)=>{
  const e=document.createElement('div');e.className='ing';
  e.style.cssText=`left:${x}%;top:${y}%;width:${s}vmin;height:${s}vmin`;
  e.innerHTML=`<span><svg viewBox="0 0 40 40">${ING[f.ing[n%f.ing.length]](f.c)}</svg></span>`;
  (fr?$('#front'):$('#back')).appendChild(e);gsap.set(e,{xPercent:-50,yPercent:-50});
  const sp=e.firstChild;
  gsap.to(sp,{x:gsap.utils.random(-16,16),y:gsap.utils.random(-18,18),rotation:gsap.utils.random(-25,25),duration:gsap.utils.random(2.4,4),repeat:-1,yoyo:true,ease:'sine.inOut'});
  o.items.push({e,sp,r,dx:(x-50)*innerWidth/100*1.3,dy:(y-50)*innerHeight/100*1.3});
 });
 return o}
function enter(tl,o,dir,t){
 const W=innerWidth,H=innerHeight;
 tl.fromTo(o.can,{y:dir*H*1.15,rotation:dir*140},{y:0,rotation:0,duration:1.25,ease:'expo.out'},t)
   .fromTo(o.word,{y:dir*H*.9},{y:0,duration:1.1,ease:'expo.out'},t-.05);
 o.items.forEach((it,n)=>tl.fromTo(it.e,{x:it.dx,y:it.dy,scale:0,opacity:0,rotation:it.r+gsap.utils.random(-200,200)},{x:0,y:0,scale:1,opacity:1,rotation:it.r,duration:1,ease:'back.out(1.3)'},t+.1+n*.04))}
function exit(tl,o,dir){
 const W=innerWidth,H=innerHeight;
 tl.to(o.can,{y:-dir*H*1.15,rotation:-dir*140,duration:.95,ease:'power3.inOut'},0)
   .to(o.word,{y:-dir*H*.9,duration:.95,ease:'power3.inOut'},0);
 o.items.forEach((it,n)=>tl.to(it.e,{x:it.dx,y:it.dy,scale:.2,opacity:0,rotation:'+=200',duration:.7,ease:'power2.in'},n*.02))}
function kill(o){gsap.killTweensOf(o.tilt);o.items.forEach(it=>{gsap.killTweensOf(it.sp);it.e.remove()});o.can.remove();o.word.remove()}

  $('#tag').textContent=f.tag;$('#desc').textContent=f.desc;$('#chips').innerHTML=f.chips.map(c=>`<span>${c}</span>`).join('');
  gsap.fromTo(els,{opacity:0,y:14},{opacity:1,y:0,duration:.5,stagger:.06})}})}

function closeM(){gsap.to('#modal',{opacity:0,duration:.2,onComplete(){$('#modal').style.display='none';document.body.classList.remove('m')}})}
function authV(m){const u=m==='up';return `<h3>${u?'Create account':'Welcome back'}</h3><div class="tabs"><button data-auth="in" class="${u?'':'on'}">Log in</button><button data-auth="up" class="${u?'on':''}">Sign up</button></div><div id="af">${u?'<label>Full name<input name="n" autocomplete="name"></label><label>Phone number<input name="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="98XXXXXXXX"></label><label>Delivery address<input name="ad" autocomplete="street-address" placeholder="Street, area, city"></label>':''}<label>Email or mobile number<input name="id" autocomplete="username"></label><label>Password<input name="p" type="password" autocomplete="${u?'new-password':'current-password'}" placeholder="${u?'At least 8 characters':''}"></label>${u?'<label class="ck"><input type="checkbox" name="t"><span>I agree to the <a href="#" data-doc="terms">Terms</a> and <a href="#" data-doc="privacy">Privacy Policy</a></span></label>':''}<p id="err"></p><button class="go" id="sub">${u?'Create account':'Log in'}</button></div><p class="note">Demo sign-in: this page has no server, so your password is never sent or saved. Only your name stays on this device.</p>`}
function show(k){const back=document.body.classList.contains('m')&&$('#af')?'<p><a href="#" data-auth="up">← Back to sign up</a></p>':'';const d=DOC[k];openM(back+'<h3>'+d[0]+'</h3><p class="d">Last updated: October 2026</p>'+d[1])}
$('#acct').onclick=()=>openM(user?`<h3>Hi, ${esc(user.name)}</h3><p>Signed in as ${esc(user.id)}</p><button class="go" id="lo">Log out</button>`:authV('in'));
document.addEventListener('click',e=>{
 const d=e.target.closest('[data-doc]');if(d){e.preventDefault();show(d.dataset.doc);return}
 const a=e.target.closest('[data-auth]');if(a){e.preventDefault();openM(authV(a.dataset.auth));return}
 if(e.target.id==='sub'){doAuth();return}
 if(e.target.id==='lo'){setUser(null);closeM();flash('Logged out');return}
 if(e.target.closest('.x')||e.target.id==='modal')closeM()});
function doAuth(){
 const f=$('#af');if(!f)return;const el=n=>f.querySelector('[name='+n+']'),v=n=>(el(n)?el(n).value:'').trim(),up=!!el('n'),id=v('id'),p=el('p').value,err=m=>{$('#err').textContent=m};
 const ok=/^\S+@\S+\.\S+$/.test(id)||/^\+?\d{7,15}$/.test(id.replace(/[\s-]/g,''));
 if(up&&!v('n'))return err('Please enter your name.');
 if(up&&!/^\+?\d{7,15}$/.test(v('ph').replace(/[\s-]/g,'')))return err('Enter a valid phone number.');
 if(up&&v('ad').length<5)return err('Enter your delivery address.');
 if(!ok)return err('Enter a valid email or mobile number.');
 if(up&&p.length<8)return err('Password must be at least 8 characters.');
 if(!up&&!p)return err('Enter your password.');
 if(up&&!el('t').checked)return err('Please accept the Terms and Privacy Policy.');
 const pr=ls.g('ms_prof')||{};if(up)pr[id]=v('n');ls.s('ms_prof',pr);
 const name=up?v('n'):(pr[id]||id.split('@')[0]);
 setUser({name,id});closeM();flash((up?'Welcome, ':'Welcome back, ')+name.split(' ')[0])}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('#af'))doAuth()});

 $('#tag').textContent=f.tag;$('#desc').textContent=f.desc;$('#chips').innerHTML=f.chips.map(c=>`<span>${c}</span>`).join('');
